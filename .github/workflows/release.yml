name: release

# After CI passes on main, semantic-release decides from the commit messages
# whether to release (see AGENTS.md):
#
#   fix: / perf:              → patch
#   feat:                     → minor
#   `!` or BREAKING CHANGE:   → major
#   docs:, ci:, chore:, …     → no release
#
# 1. plan:    a dry run works out the next version, or that there is none.
# 2. build:   the binaries are built for every platform with that version.
# 3. release: semantic-release writes CHANGELOG.md, stamps the version into
#             Cargo.toml, Cargo.lock and npm/skillpouch, commits that as
#             `chore(release): x.y.z [skip ci]`, tags `vx.y.z`, publishes the
#             `@skillpouch/cli-<os>-<cpu>` packages and then `skillpouch` to
#             npm, and creates the GitHub release with the binaries.
#
# The release job refuses a version other than the planned one, and does
# nothing when main moved on in the meantime: the newer commit's run releases.
# npm publishing uses trusted publishing (OIDC): no token is stored. Each
# package on npmjs.com trusts this repository's `release.yml`.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Linux runners are pinned to ubuntu-24.04: a new `ubuntu-latest` image only
# arrives on purpose, not under a green build.
jobs:
  plan:
    name: next version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # semantic-release works on a branch; it stops by itself when the remote
      # main has commits this one doesn't.
      - run: git switch -C main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx semantic-release --dry-run
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -f .release-version ]]; then
            version=$(cat .release-version)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Releasing **v$version**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat, fix or perf commits since the last one." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Static Linux builds: C code (ring, SQLite) goes through musl's gcc.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - run: node scripts/release.mjs stamp "$VERSION"
        shell: bash
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p skillpouch
      - name: Check it runs
        if: "!startsWith(matrix.target, 'aarch64-pc-windows') && !(startsWith(matrix.target, 'x86_64-apple'))"
        shell: bash
        run: |
          out=$(target/${{ matrix.target }}/release/skillpouch --version)
          echo "$out"
          [[ "$out" == *"$VERSION"* ]]
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/skillpouch$ext" "dist/skillpouch-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v7
        with:
          name: skillpouch-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release v${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Trusted publishing: npm trades this job's OIDC token for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - run: git switch -C main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true
      - name: Archive the binaries
        run: |
          mkdir release-assets
          cd binaries
          for file in *; do
            case "$file" in
              *.exe) zip -q "../release-assets/${file%.exe}.zip" "$file" ;;
              *) chmod +x "$file" && tar -czf "../release-assets/$file.tar.gz" "$file" ;;
            esac
          done
          cd ../release-assets
          sha256sum * > SHA256SUMS
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          BINARIES: ${{ github.workspace }}/binaries
        run: npx semantic-release
