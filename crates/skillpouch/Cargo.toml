[package]
name = "skillpouch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
gethostname = "1.1.0"
indicatif = "0.18.6"
serde_json = "1.0.151"
sp-api = { version = "0.1.0", path = "../sp-api" }
sp-core = { version = "0.1.0", path = "../sp-core" }
sp-crypto = { version = "0.1.0", path = "../sp-crypto" }
sp-tui = { version = "0.1.0", path = "../sp-tui" }
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2.2.2"
serde = "1.0.229"
tempfile = "3.27.0"
