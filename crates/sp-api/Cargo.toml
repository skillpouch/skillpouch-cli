[package]
name = "sp-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
# ring builds for every release target with just a C compiler.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sp-core = { version = "0.1.0", path = "../sp-core" }
blake3 = "1.8.7"
sp-crypto = { version = "0.1.0", path = "../sp-crypto" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
