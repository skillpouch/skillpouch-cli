[package]
name = "sp-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sp-api = { path = "../sp-api" }
sp-core = { path = "../sp-core" }
sp-crypto = { path = "../sp-crypto" }
sp-harness = { path = "../sp-harness" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.7"
toml_edit = "0.25"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
