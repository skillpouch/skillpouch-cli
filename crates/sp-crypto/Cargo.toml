[package]
name = "sp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "getrandom", "nistp"] }
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sp-core = { path = "../sp-core" }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4"] }
